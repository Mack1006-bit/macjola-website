<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Blended Gradient: Industrial Orange to Deep Technical Blue -->
    <linearGradient id="macjolaOrangeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="50%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>

    <!-- Horizontal Text Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#003366" />
    </linearGradient>
  </defs>

  <!-- LOGO MARK: Gear + M Monogram -->
  <g transform="translate(10, 10)">
    <!-- Outer Gear/Ring Body -->
    <path d="M 50 10 A 40 40 0 1 0 50 90 A 40 40 0 1 0 50 10 Z" fill="none" stroke="url(#macjolaOrangeBlueGrad)" stroke-width="8" stroke-dasharray="18 6" />
    <circle cx="50" cy="50" r="44" fill="none" stroke="#002855" stroke-width="2" opacity="0.3" />

    <!-- Sharp Engineering 'M' inside -->
    <path d="M 28 68 L 28 32 L 50 54 L 72 32 L 72 68" fill="none" stroke="url(#macjolaOrangeBlueGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Precision Tech Dots -->
    <circle cx="50" cy="54" r="3.5" fill="#FF6B00" />
    <circle cx="28" cy="32" r="3" fill="#FF6B00" />
    <circle cx="72" cy="32" r="3" fill="#003366" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g transform="translate(115, 38)">
    <!-- MACJOLA Main Title -->
    <text x="0" y="22" font-family="&#39;Montserrat&#39;, &#39;Inter&#39;, sans-serif" font-size="32" font-weight="800" fill="#002855" letter-spacing="2">
      MAC<tspan fill="#FF6B00">JOLA</tspan>
    </text>

    <!-- Subtitle / Descriptor -->
    <text x="2" y="44" font-family="&#39;Inter&#39;, sans-serif" font-size="12" font-weight="700" fill="#003366" letter-spacing="3.5">
      ENGINEERING LIMITED
    </text>
    
    <!-- Blended Gradient Accent Line -->
    <line x1="2" y1="52" x2="280" y2="52" stroke="url(#lineGrad)" stroke-width="2.5" opacity="0.95" />
  </g>
</svg>